<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="icon.svg">
<title>Importar códigos — PI1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Importar códigos de envio</h1>
  <p><a class="topo-link" href="index.html">← início</a></p>
</header>
<main>
  <div class="card">
    <p class="muted">Cole aqui os códigos que os alunos mandaram (começam com <code>PI1:</code>), um por linha. Precisa de internet.</p>
    <textarea id="caixa" class="codigo" rows="8" placeholder="PI1:eyJ..."></textarea>
    <button class="big" id="ir">Importar</button>
    <div id="saida"></div>
  </div>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
registrarSW();
carregarConfig('A').catch(() => {}); carregarConfig('B').catch(() => {});
$('#ir').addEventListener('click', async () => {
  const saida = $('#saida'); saida.replaceChildren();
  const linhas = $('#caixa').value.split(/\s+/).filter(s => s.startsWith('PI1:'));
  if (!linhas.length) { saida.append(el('div', { class: 'msg erro' }, 'Nenhum código encontrado.')); return; }
  $('#ir').disabled = true;
  for (const l of linhas) {
    let d;
    try { d = decodificar(l); } catch (e) { saida.append(el('div', { class: 'msg erro' }, 'Código ilegível: ' + l.slice(0, 20) + '…')); continue; }
    try {
      const r = await apiPost(d);
      const quem = nomeAluno(d.avaliador && d.avaliador.id);
      if (!r.ok) throw new Error(r.erro);
      const ok = r.resultados.filter(x => x.status === 'ok').length;
      const dup = r.resultados.filter(x => x.status === 'duplicado').length;
      const err = r.resultados.filter(x => x.status === 'erro');
      saida.append(el('div', { class: err.length ? 'msg aviso' : 'msg ok' },
        quem + ': ' + ok + ' importada(s)' + (dup ? ', ' + dup + ' já existia(m)' : '') + (err.length ? ', ' + err.length + ' com erro (' + err.map(x => x.msg).join('; ') + ')' : '') + '.'));
    } catch (e) { saida.append(el('div', { class: 'msg erro' }, 'Falhou: ' + (e.message || e))); }
  }
  $('#ir').disabled = false;
});
</script>
</body>
</html>
